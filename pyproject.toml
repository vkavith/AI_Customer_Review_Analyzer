[project]
name = "ai-customer-review-analyzer"
version = "0.1.0"
description = "RAG app that analyzes customer reviews using LangChain, Groq, and Postgres/pgvector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.37",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-groq>=0.1",
    "langchain-postgres>=0.0.9",
    "langchain-huggingface>=0.0.3",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    # "langchain-openai>=0.1",  # optional fallback provider
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
